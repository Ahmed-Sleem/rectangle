worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  access_log    /dev/stdout;
  sendfile      on;
  server_tokens off;

  # The image runs as a non-root user, so every path nginx writes to has to sit
  # somewhere that user owns.
  client_body_temp_path /tmp/client_body;
  proxy_temp_path       /tmp/proxy;
  fastcgi_temp_path     /tmp/fastcgi;
  uwsgi_temp_path       /tmp/uwsgi;
  scgi_temp_path        /tmp/scgi;

  gzip              on;
  gzip_vary         on;
  gzip_min_length   1024;
  gzip_types        text/plain text/css application/javascript application/json image/svg+xml font/woff2;

  server {
    listen 3000;
    root /usr/share/nginx/html;
    index index.html;

    # Vite emits content-hashed filenames, so built assets can be cached
    # indefinitely. index.html must never be, or a deploy would not reach
    # anyone holding a cached copy.
    location /assets/ {
      expires 1y;
      add_header Cache-Control "public, immutable";
      try_files $uri =404;
    }

    location = /index.html {
      add_header Cache-Control "no-cache";
    }

    # Deep links such as /projects are client-side routes with no file behind
    # them; the SPA has to receive them itself.
    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
